name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    # This upstream-only environment provisions Homebrew's Copilot coding-agent
    # toolchain. x86MacBrew validates its Intel continuation with its dedicated
    # manual Intel baseline workflow instead.
    if: github.repository_owner == 'Homebrew'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          core: true
          cask: true

      - run: brew install-bundler-gems --groups=all

      # install Homebrew formulae we might need
      - run: brew install shellcheck shfmt gh gnu-tar subversion curl

      # brew tests doesn't like world writable directories
      - run: sudo chmod -R g-w,o-w /home/linuxbrew/.linuxbrew/Homebrew
